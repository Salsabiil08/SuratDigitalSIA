name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npm audit --audit-level=critical
      - run: npm run build
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: npm run test:db
      - run: mkdir -p test-results && bash scripts/readiness/test-forward.sh

  browser-public:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-public-only
      NEXT_PUBLIC_SIADOCS_ENV: staging
      SIADOCS_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: pip install -r scripts/readiness/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
      - run: |
          mkdir -p test-results
          npm run start -- -H 127.0.0.1 -p 3108 > test-results/public-server.log 2>&1 &
          task_server_pid=$!
          trap 'kill "$task_server_pid" 2>/dev/null || true' EXIT
          python scripts/readiness/browser-public.py
      - run: |
          node scripts/readiness/pdf-placement-fixture.mjs
          ./node_modules/.bin/vite --config tests/browser/pdf-placement/vite.config.ts > test-results/pdf-placement-server.log 2>&1 &
          pdf_server_pid=$!
          trap 'kill "$pdf_server_pid" 2>/dev/null || true' EXIT
          python scripts/readiness/pdf-placement-browser.py
      - run: |
          ./node_modules/.bin/vitest run tests/guided-document.test.ts
          ./node_modules/.bin/vite --config tests/browser/editor/vite.config.ts > test-results/editor-server.log 2>&1 &
          editor_server_pid=$!
          trap 'kill "$editor_server_pid" 2>/dev/null || true' EXIT
          python scripts/readiness/editor-browser.py
      - run: |
          ./node_modules/.bin/vitest run tests/billing-docx.test.ts tests/legacy-billing-output.test.ts
          ./node_modules/.bin/vite --config tests/browser/billing/vite.config.ts > test-results/billing-server.log 2>&1 &
          billing_server_pid=$!
          trap 'kill "$billing_server_pid" 2>/dev/null || true' EXIT
          python scripts/readiness/billing-browser.py
      - run: |
          ./node_modules/.bin/vite --config tests/browser/ux/vite.config.ts > test-results/ux-server.log 2>&1 &
          ux_server_pid=$!
          trap 'kill "$ux_server_pid" 2>/dev/null || true' EXIT
          python scripts/readiness/ux-browser.py
      - run: |
          ./node_modules/.bin/vite --config tests/browser/comments/vite.config.ts > test-results/comments-server.log 2>&1 &
          comments_server_pid=$!
          trap 'kill "$comments_server_pid" 2>/dev/null || true' EXIT
          python scripts/readiness/comments-browser.py
      - run: |
          ./node_modules/.bin/vite --config tests/browser/manual-number/vite.config.ts > test-results/manual-number-server.log 2>&1 &
          manual_server_pid=$!
          trap 'kill "$manual_server_pid" 2>/dev/null || true' EXIT
          python scripts/readiness/manual-number-browser.py
      - run: |
          ./node_modules/.bin/vite --config tests/browser/responsive/vite.config.ts > test-results/responsive-server.log 2>&1 &
          responsive_server_pid=$!
          trap 'kill "$responsive_server_pid" 2>/dev/null || true' EXIT
          python scripts/readiness/responsive-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-public-browser
          path: test-results/readiness-browser/
